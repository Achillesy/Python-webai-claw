<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.55 system-ui, sans-serif; margin: 12px; width: 300px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 6px; }
  .row { margin: 7px 0; }
  .mut { color: #666; font-size: 12px; }
  button { cursor: pointer; margin-right: 4px; }
  button:disabled { cursor: default; opacity: 0.55; }
  .ok { color: #2e7d32; }
  .warn { color: #b26a00; }
  .err { color: #c62828; }
  .detail { white-space: pre-wrap; word-break: break-word; }
  .detail:empty { display: none; }
  details { margin: 10px 0 6px; }
  summary { cursor: pointer; color: #555; font-size: 12px; }
  .advanced { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e5e5e5; }
  #mid { word-break: break-all; }
</style>
</head>
<body>
  <h1>webai-claw <span id="ver" class="mut" style="font-weight:normal"></span></h1>

  <div class="row">Host: <span id="host">checking…</span></div>
  <div class="row">State: <span id="state" aria-live="polite">checking…</span></div>
  <div class="row mut detail" id="detail" aria-live="polite"></div>

  <div class="row">
    <button id="connect" disabled title="Send AI-AGENT.md and this machine's configuration to the chat">Connect</button>
    <button id="disconnect" hidden>Disconnect</button>
    <button id="interrupt" hidden>Interrupt</button>
  </div>

  <label class="row" style="display:block"
         title="Results are filled into the input box. When on, they are sent automatically.">
    <input type="checkbox" id="autosend" checked> Auto-send command results
  </label>
  <label class="row" style="display:block"
         title="When off, AI-requested attachments stay in the input box until you press Send.">
    <input type="checkbox" id="attachauto"> Auto-send attachments
  </label>

  <details>
    <summary>Advanced</summary>
    <div class="advanced">
      <div class="row">Machine ID: <span id="mid" class="mut">unavailable</span>
        <button id="copymid" disabled>Copy UUID</button>
      </div>
      <div class="row"><button id="ping">Test Bridge</button></div>
    </div>
  </details>

  <div class="row mut">Useful? Buy the author a coffee:
    <a href="https://ko-fi.com/achillesy" target="_blank">Ko-fi</a> ·
    <a href="https://paypal.me/achillesnewman" target="_blank">PayPal</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
